name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.13.1', '24.x']
    runs-on: ${{ matrix.os }}
    env:
      NODE_OPTIONS: --experimental-strip-types
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium headless shell
        run: npx playwright-core install --only-shell chromium

      - name: Run typecheck, build and test suite
        run: npm run verify

